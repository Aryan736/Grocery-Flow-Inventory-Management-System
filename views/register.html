<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - Inventory Management</title>
  <style>
    :root {
      --primary: #2f80ed;
      --background: #f4f7fb;
      --card: #ffffff;
      --text: #222;
      --muted: #6c7284;
      --border: #e2e8f0;
      --shadow: 0 20px 50px rgba(15, 23, 42, 0.08);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: linear-gradient(180deg, #eef3fb 0%, #ffffff 100%);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .auth-card {
      width: min(420px, 100%);
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 24px;
      box-shadow: var(--shadow);
      padding: 36px 32px;
    }

    .auth-card h1 {
      margin: 0 0 10px;
      font-size: 28px;
      letter-spacing: -0.02em;
    }

    .auth-card p.subtitle {
      margin: 0 0 28px;
      color: var(--muted);
      line-height: 1.6;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      color: var(--muted);
    }

    .form-group input {
      width: 100%;
      padding: 14px 16px;
      border: 1px solid var(--border);
      border-radius: 14px;
      font-size: 15px;
      background: #fafbff;
      color: var(--text);
      transition: border-color 0.2s ease;
    }

    .form-group input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(47, 128, 237, 0.12);
    }

    .btn-submit {
      width: 100%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 14px 18px;
      font-size: 16px;
      color: #fff;
      background: var(--primary);
      border: none;
      border-radius: 14px;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .btn-submit:hover {
      transform: translateY(-1px);
      box-shadow: 0 14px 30px rgba(47, 128, 237, 0.18);
    }

    .auth-footer {
      margin-top: 22px;
      font-size: 14px;
      text-align: center;
      color: var(--muted);
    }

    .auth-footer a {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
    }

    @media (max-width: 480px) {
      body {
        padding: 16px;
      }
      .auth-card {
        padding: 28px 20px;
      }
    }
  </style>
</head>
<body>
  <div class="auth-card">
    <h1>Create your account</h1>
    <p class="subtitle">Register to manage inventory, customers, and stock from one secure dashboard.</p>
    <form action="/register" method="post">
      <div class="form-group">
        <label for="name">Full name</label>
        <input id="name" name="name" type="text" placeholder="Enter your full name" required>
      </div>
      <div class="form-group">
        <label for="email">Email address</label>
        <input id="email" name="email" type="email" placeholder="you@example.com" required>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" placeholder="Create a password" required>
      </div>
      <div class="form-group">
        <label for="confirm_password">Confirm password</label>
        <input id="confirm_password" name="confirm_password" type="password" placeholder="Repeat your password" required>
      </div>
      <button type="submit" class="btn-submit">Register</button>
    </form>
    <p class="auth-footer">Already have an account? <a href="login.html">Sign in</a></p>
  </div>
</body>
</html>

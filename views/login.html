<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login-Inventory Management</title>

    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Icons -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.1/css/all.min.css"
    />

    <style>
      body {
        font-family: Inter, sans-serif;
      }

      html {
        scroll-behavior: smooth;
      }

      /* Floating Animation */

      @keyframes floating {
        0% {
          transform: translateY(0px);
        }

        50% {
          transform: translateY(-12px);
        }

        100% {
          transform: translateY(0px);
        }
      }

      .float {
        animation: floating 4s ease-in-out infinite;
      }

      .float2 {
        animation: floating 5s ease-in-out infinite;
      }

      .float3 {
        animation: floating 6s ease-in-out infinite;
      }

      .glow {
        filter: blur(90px);
      }
    </style>
  </head>
  <body class="bg-slate-50">
    <main class="min-h-screen grid lg:grid-cols-2">
      <!-- ================= LEFT SIDE ================= -->

      <section
        class="relative hidden lg:flex items-center justify-center overflow-hidden bg-gradient-to-br from-blue-50 via-green-50 to-slate-50"
      >
        <!-- background circles -->

        <div
          class="absolute w-40 h-40 rounded-full bg-blue-200/30 left-20 top-24"
        ></div>

        <div
          class="absolute w-28 h-28 rounded-full bg-green-200/30 bottom-20 right-24"
        ></div>

        <div
          class="absolute w-16 h-16 rounded-full bg-yellow-200/40 top-72 right-64"
        ></div>

        <div
          class="absolute w-20 h-20 rounded-full bg-red-100/40 bottom-40 left-40"
        ></div>

        <!-- Floating Icons -->

        <div class="absolute left-20 top-44 bg-white p-3 rounded-2xl shadow-lg">
          <i class="fa-solid fa-cart-shopping text-blue-600 text-lg"></i>
        </div>

        <div
          class="absolute left-20 bottom-60 bg-white p-3 rounded-2xl shadow-lg"
        >
          <i class="fa-solid fa-basket-shopping text-orange-400 text-lg"></i>
        </div>

        <div
          class="absolute left-52 bottom-36 bg-white p-3 rounded-2xl shadow-lg"
        >
          <i class="fa-solid fa-box text-green-500 text-lg"></i>
        </div>

        <div
          class="absolute right-28 top-40 bg-white p-3 rounded-2xl shadow-lg"
        >
          <i class="fa-regular fa-apple-whole text-red-500 text-lg"></i>
        </div>

        <div
          class="absolute right-36 bottom-32 bg-white p-3 rounded-2xl shadow-lg"
        >
          <i class="fa-solid fa-bottle-water text-blue-500 text-lg"></i>
        </div>

        <!-- Content -->

        <div class="relative z-10 max-w-lg text-center">
          <!-- Illustration Box -->

          <div class="bg-white rounded-[28px] shadow-xl p-8 inline-block">
            <!-- Temporary Illustration -->

            <img
              src="../assets/grocery-logo.png"
              class="w-64"
            />
          </div>

          <h1 class="mt-10 text-4xl font-bold text-slate-800">
            Manage your store with ease.
          </h1>

          <p class="mt-5 text-lg text-slate-500 leading-8">
            Track products, monitor inventory and keep your business organized —
            all from one simple dashboard.
          </p>
        </div>
      </section>

      <!-- ================= RIGHT SIDE ================= -->

      <section class="flex items-center justify-center px-5 py-10">
        <div class="w-full max-w-sm bg-white rounded-[24px] shadow-2xl p-8">
                 

          <!-- Logo -->

          <div class="flex justify-center mt-8">
            <div
              class="w-14 h-14 rounded-2xl bg-blue-600 flex items-center justify-center shadow-lg"
            >
              <i class="fa-solid fa-leaf text-white text-xl"></i>
            </div>
          </div>

          <!-- Heading -->

          <div class="text-center mt-8">
            <h2 class="text-3xl font-bold text-slate-800">Welcome Back</h2>

            <p class="text-slate-500 mt-3 text-base">
              Sign in to access your dashboard
            </p>
          </div>

          <!-- Form -->

          <form class="mt-8 space-y-5">
            <!-- Email -->

            <div>
              <label class="block font-medium mb-2"> Email Address </label>

              <div class="relative">
                <i
                  class="fa-regular fa-envelope absolute left-4 top-4 text-slate-400"
                ></i>

                <input
                  type="email"
                  placeholder="name@example.com"
                  class="w-full h-12 rounded-xl border border-slate-200 bg-slate-50 pl-10 outline-none focus:ring-2 focus:ring-blue-500"
                />
              </div>
            </div>

            <!-- Password -->

            <div>
              <div class="flex justify-between mb-2">
                <label class="font-medium"> Password </label>

                <a href="#" class="text-blue-600 text-sm"> Forgot Password? </a>
              </div>

              <div class="relative">
                <i
                  class="fa-solid fa-lock absolute left-4 top-4 text-slate-400"
                ></i>

                <input
                  id="password"
                  type="password"
                  placeholder="Enter your password"
                  class="w-full h-12 rounded-xl border border-slate-200 bg-slate-50 pl-10 pr-10 outline-none focus:ring-2 focus:ring-blue-500"
                />

                <button
                  id="togglePassword"
                  type="button"
                  class="absolute right-4 top-4 text-slate-400"
                >
                  <i class="fa-regular fa-eye"></i>
                </button>
              </div>
            </div>

            <!-- Button -->

            <button
              class="w-full h-12 rounded-xl bg-blue-600 text-white text-base font-semibold hover:bg-blue-700 transition"
            >
              Login
            </button>
          </form>

          <p class="text-center mt-6 text-slate-500">
            Don't have an account?

            <a href="register.html" class="text-blue-600 font-semibold"> Register </a>
          </p>
        </div>
      </section>
    </main>
  </body>

</html>
